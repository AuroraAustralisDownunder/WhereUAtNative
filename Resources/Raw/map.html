<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Where U At — Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin="" />
  <style>
    html, body { margin: 0; padding: 0; height: 100%; width: 100%; background: #e8eef5; }
    #map { height: 100%; width: 100%; }
    .empty {
      display: none;
      height: 100%;
      width: 100%;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      box-sizing: border-box;
      font-family: system-ui, -apple-system, sans-serif;
      color: #555;
      font-size: 16px;
    }
    .empty.visible { display: flex; }
    #map.hidden { display: none; }
  </style>
</head>
<body>
  <div id="empty" class="empty visible">Turn on location sharing to see yourself on the map.</div>
  <div id="map" class="hidden"></div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
          crossorigin=""></script>
  <script>
    (function () {
      var map = null;
      var marker = null;
      var emptyEl = document.getElementById('empty');
      var mapEl = document.getElementById('map');

      function ensureMap() {
        if (map) return map;
        mapEl.classList.remove('hidden');
        emptyEl.classList.remove('visible');
        map = L.map('map', { zoomControl: true }).setView([0, 0], 2);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
          maxZoom: 19,
          attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
        }).addTo(map);
        setTimeout(function () { map.invalidateSize(); }, 100);
        return map;
      }

      window.setPin = function (lat, lon) {
        lat = Number(lat);
        lon = Number(lon);
        if (!isFinite(lat) || !isFinite(lon)) {
          window.clearPin('Waiting for GPS…');
          return;
        }
        ensureMap();
        var latlng = L.latLng(lat, lon);
        if (marker) {
          marker.setLatLng(latlng);
        } else {
          marker = L.marker(latlng).addTo(map).bindPopup('You');
        }
        map.setView(latlng, 15);
        setTimeout(function () { if (map) map.invalidateSize(); }, 50);
      };

      window.clearPin = function (message) {
        if (marker && map) {
          map.removeLayer(marker);
          marker = null;
        }
        mapEl.classList.add('hidden');
        emptyEl.textContent = message || 'Turn on location sharing to see yourself on the map.';
        emptyEl.classList.add('visible');
      };

      window.showEmpty = function (message) {
        window.clearPin(message);
      };

      // Query-string bootstrap: ?lat=&lon= or ?empty=1&msg=
      try {
        var params = new URLSearchParams(window.location.search || '');
        if (params.get('empty') === '1') {
          window.clearPin(params.get('msg') || 'Turn on location sharing to see yourself on the map.');
        } else if (params.has('lat') && params.has('lon')) {
          window.setPin(params.get('lat'), params.get('lon'));
        }
      } catch (e) { /* ignore */ }
    })();
  </script>
</body>
</html>
